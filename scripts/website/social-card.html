<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FDO 1.0.5 social card</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #111713;
        color: #eef1e9;
        font-family: Arial, sans-serif;
        padding: 54px 60px;
        position: relative;
        overflow: hidden;
      }
      .brand {
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -1px;
      }
      .brand span {
        color: #c8f58a;
      }
      .version {
        position: absolute;
        right: 60px;
        top: 62px;
        color: #c8f58a;
        font: 14px monospace;
      }
      .label {
        color: #c8f58a;
        font: 12px monospace;
        letter-spacing: 2px;
        margin-top: 48px;
      }
      h1 {
        font-size: 62px;
        line-height: 1.05;
        letter-spacing: -3px;
        font-weight: 600;
        margin: 22px 0;
        width: 570px;
      }
      h1 span {
        color: #c8f58a;
      }
      .description {
        font: 18px/1.6 Arial;
        max-width: 480px;
        color: #b4c1ad;
      }
      .shot {
        margin: 0;
        position: absolute;
        left: 644px;
        top: 167px;
        width: 510px;
        border: 1px solid #61784d;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 20px 70px #0008;
        transform: rotate(-3deg);
      }
      .shot img {
        display: block;
        width: 100%;
        height: auto;
      }
      footer {
        position: absolute;
        bottom: 38px;
        left: 60px;
        right: 60px;
        display: flex;
        justify-content: space-between;
        border-top: 1px solid #46503e;
        padding-top: 22px;
        color: #a7b2a6;
        font: 14px monospace;
      }
    </style>
  </head>
  <body>
    <div class="brand">FDO<span>.</span></div>
    <span class="version">VERSION 1.0.5</span>
    <p class="label">OPEN-SOURCE DEVOPS WORKSPACE</p>
    <h1>DevOps tools.<br />Your workspace.<br /><span>Your way.</span></h1>
    <p class="description">
      Plugin workflows. Built-in SSH. GitOps.<br />From your desktop to Docker.
    </p>
    <figure class="shot">
      <img
        src="../../website/assets/fdo-azure-finops.png"
        alt="Azure FinOps plugin running in FDO demo mode"
      />
    </figure>
    <footer>
      <span>macOS · Windows · Linux</span><span>fdo.alexvwan.me</span>
    </footer>
  </body>
</html>
